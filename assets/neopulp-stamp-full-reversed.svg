<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 176" width="320" height="176" role="img" aria-label="Neopulp format mark">
  <title>Neopulp format stamp — full, reversed for dark covers</title>
  <rect x="3" y="3" width="314" height="170" fill="none" stroke="#F2F0EB" stroke-width="6"></rect>
  <text x="21" y="48" font-family="Archivo, &#39;Archivo Black&#39;, Helvetica, Arial, sans-serif" font-weight="900" font-size="30" letter-spacing="-0.6" fill="#F2F0EB" textLength="158" lengthAdjust="spacingAndGlyphs">NEOPULP</text>
  <rect x="277" y="27" width="20" height="20" fill="#E8FF4D" stroke="#F2F0EB" stroke-width="3"></rect>
  <rect x="21" y="62" width="278" height="3" fill="#F2F0EB"></rect>
  <text x="21" y="90" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="-0.3" fill="#F2F0EB">One big premise,</text>
  <text x="21" y="109" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="-0.3" fill="#F2F0EB">followed all the way.</text>
  <text x="21" y="136" font-family="&#39;JetBrains Mono&#39;, ui-monospace, monospace" font-size="9.5" letter-spacing="1" fill="#A8A49B">HUMAN IDEA · MACHINE PROSE</text>
  <text x="21" y="150" font-family="&#39;JetBrains Mono&#39;, ui-monospace, monospace" font-size="9.5" letter-spacing="1" fill="#A8A49B">FORMAT MARK · EST. 2026</text>
</svg>